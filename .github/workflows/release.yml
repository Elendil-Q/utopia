# 发布容器镜像到 ghcr.io。没有这个，README 承诺的"一条命令"实际是
# "在自己机器上编译 Rust release + LTO 二十分钟，还得先拉得到 rust/node 基础镜像"。
#
# **只由手工触发**：Actions 页面 Run workflow，或
# `gh workflow run release.yml -f tag=0.1.0`。不再监听 tag 推送——打 tag 和发镜像
# 解耦，什么时候发、发哪个版本由人决定，误推一个 tag 不会再顺带把镜像推上去。
#
# 镜像是多平台的：linux/amd64 + linux/arm64。rc7 及之前只有 amd64，Apple Silicon
# 和 Graviton 上 `docker pull` 直接报 "no matching manifest for linux/arm64/v8"，
# 强制 --platform 之后又是在 QEMU 里跑。
#
# 两个平台各自在**自己架构的 runner 上原生**构建（矩阵），而不是在一台 amd64 机器上
# 用 QEMU 交叉构建：Rust release + LTO 在 QEMU 下要一小时以上，原生二十分钟。
# 各平台冒烟通过后按 digest 推送（不打标签），最后一个 job 把两个 digest 合成一个
# manifest list 并打上全部标签——标签只在两个平台都验证过之后才会移动。
# 做法照 docker/build-push-action 的 "Distribute build across multiple runners"。
name: Release

# 唯一的入口是 workflow_dispatch：原来的 `push: tags: ["v*"]` 已去掉，
# 正式版与 rc 现在都从这里手动发。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0-rc5)"
        required: true
        type: string
      # latest 要显式勾选：手工输入的标签五花八门（rc、hotfix、试用的名字），
      # 继续用「标签里有没有连字符」当判据，一个叫 test 的分支发布就会把 latest 拖走。
      latest:
        description: "Also move the 'latest' tag to this image"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      # 一个平台冒烟失败就没有可发布的东西，另一个不必接着跑
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # 公开仓库可免费用 GitHub 托管的 arm64 runner
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # ghcr 要求镜像名全小写；github.repository 在 fork 里可能带大写
      # （metadata-action 自己会转小写，但按 digest 推送时名字是我们直接给的）
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 这里只要 labels；标签在 merge job 里打到 manifest list 上
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      # 先只 load 到本地跑一遍。"镜像构建成功"证明不了"容器能起来"——
      # glibc 跨发行版不匹配就是构建全绿、启动即死。
      # 缓存按平台分 scope：两个架构的层互不相干，混在一个 scope 里只会互相挤掉。
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: utopia:smoke
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Smoke test — boot it, migrate, register a user
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=utopia -e POSTGRES_PASSWORD=utopia -e POSTGRES_DB=utopia \
            pgvector/pgvector:pg16
          # 轮询条件一律写进 if：set -e 下 `cmd && break` 在 cmd 失败时会终止整个
          # 脚本，把"还没就绪"变成"构建失败"。
          for _ in $(seq 1 40); do
            if docker exec pg pg_isready -U utopia -d utopia >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # 故意不给 UTOPIA_JWT_SECRET：让这一跑覆盖自动生成那条路径。
          # 下面的注册请求会签发并携带 token，密钥没生成好就过不了。
          #
          # UTOPIA_MIGRATION_URL 显式传空串，而不是不传：compose 的
          # `${VAR:-}` 在变量没设时发出去的就是空串，而这条冒烟测试原本直接
          # docker run、从不传它，于是 #343 全绿发布、用户照 README 起就退出
          # （"relative URL without a base"）。空串必须等同于未设，在这里钉住。
          docker run -d --name app --network smoke -p 1516:1516 \
            -e UTOPIA_DATABASE_URL=postgres://utopia:utopia@pg:5432/utopia \
            -e UTOPIA_MIGRATION_URL= \
            utopia:smoke

          # 必须打 /api/v1/health 并核对 JSON：健康检查挂在 nest("/api/v1") 里，
          # 而镜像带 SPA fallback——请求 /health 会拿到 200 的 index.html，看着像通过。
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf -m 3 http://localhost:1516/api/v1/health -o /tmp/h.json \
               && grep -q '"status":"ok"' /tmp/h.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::container never became healthy"; docker logs app; exit 1; fi

          # 注册一次，把迁移 + argon2 + JWT 签发整条链路真正走一遍
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' -m 10 \
            -X POST http://localhost:1516/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-password-123","display_name":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "::error::register returned $code"; cat /tmp/reg.json; docker logs app; exit 1
          fi
          grep -q '"token"' /tmp/reg.json || { echo "::error::no token issued"; cat /tmp/reg.json; exit 1; }
          echo "smoke test passed on ${{ matrix.platform }}: healthy, migrated, user registered, token issued"

      # 冒烟通过才推送，而且只按 digest 推、不打标签：这一层在仓库里没有名字，
      # 用户拉不到。标签由 merge job 在两个平台都通过之后一起打。
      # 缓存已热，这步基本是瞬间完成。
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # 把 digest 以文件名的形式交给 merge job（一个空文件，名字就是 sha256 后面那串）
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 两个平台的 digest 合成一个 manifest list，打上全部标签
  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # 手工触发时版本号只来自输入框，不再从 ref 猜。semver 那两条只对 tag ref
          # 生效——从 Actions 页面选一个 tag 来跑（`--ref v0.1.0`）才会额外命中，
          # 从分支跑就只打输入的那个标签。
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest 只在显式勾选时才动。默认 false 意味着手工发的镜像永远不碰
            # latest（rc 和 hotfix 要的正是这个），要发正式版就勾上。
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046  # 两处 $(...) 都要按空格拆成多个参数
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      # 核对推上去的 manifest list 确实同时含 amd64 与 arm64。attestation 那些
      # unknown/unknown 的条目要过滤掉，所以只看 os=linux 的
      - name: Inspect
        run: |
          set -euo pipefail
          ref="${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          docker buildx imagetools inspect --raw "$ref" \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture]
                     | contains(["amd64", "arm64"])' >/dev/null \
            || { echo "::error::$ref does not carry both linux/amd64 and linux/arm64"; exit 1; }
